
name: Deploy Website to Hostiran

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Upload website
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Deploy website via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ ftp.chemeng-ard.ir }}
          username: ${{ github@chemeng-ard.ir }}
          password: ${{ 57579494rr@RR }}
          server-dir: ${{ home/chemenga/public_html }}
          protocol: ftps
          port: 21
          local-dir: ./
          dry-run: true
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
