<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ثبت موفق اطلاعات | انجمن مهندسی شیمی</title>

    <link rel="stylesheet" href="css/success.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="imge/png" href="photo/لوگو انجمن.webp">
</head>

<body>

    <!-- Background Elements -->
    <div class="background">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>

        <div class="grid"></div>

        <span class="floating-shape shape-1"></span>
        <span class="floating-shape shape-2"></span>
        <span class="floating-shape shape-3"></span>
    </div>


    <!-- Main -->
    <main class="success-container">

        <div class="success-card">

            <!-- Top Line -->
            <div class="top-line"></div>


            <!-- Icon -->
            <div class="success-icon">

                <div class="icon-circle">

                    <svg
                        class="check-icon"
                        viewBox="0 0 52 52"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <circle
                            cx="26"
                            cy="26"
                            r="24"
                            class="circle-path"
                        />

                        <path
                            d="M15 27L22 34L38 18"
                            class="check-path"
                        />

                    </svg>

                </div>

            </div>


            <!-- Small Label -->
            <div class="status-label">

                <span class="status-dot"></span>

                <span>
                    ثبت اطلاعات با موفقیت انجام شد
                </span>

            </div>


            <!-- Title -->
            <h1>
                اطلاعات شما
                <span>ثبت شد</span>
            </h1>


            <!-- Description -->
            <p class="description">
                اطلاعات پیش‌ثبت‌نام شما با موفقیت دریافت شد
                و برای بررسی ارسال گردید.
            </p>


            <!-- Info Box -->
            <div class="info-box">

                <div class="info-icon">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <circle
                            cx="12"
                            cy="12"
                            r="9"
                        />

                        <path
                            d="M12 11V16"
                        />

                        <circle
                            cx="12"
                            cy="7.5"
                            r="0.8"
                            fill="currentColor"
                            stroke="none"
                        />

                    </svg>

                </div>


                <div class="info-text">

                    <h3>
                        مرحله بعد
                    </h3>

                    <p>
                        پس از بررسی اطلاعات، زمان شروع دوره
                        و مراحل بعدی از طریق راه ارتباطی ثبت‌شده
                        به شما اطلاع داده خواهد شد.
                    </p>

                </div>

            </div>


            <!-- Buttons -->
            <div class="actions">

                <a
                    href="index.html"
                    class="primary-btn"
                >
                    <span>
                        بازگشت به صفحه اصلی
                    </span>

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                    >
                        <path
                            d="M19 12H5"
                        />

                        <path
                            d="M12 19L5 12L12 5"
                        />
                    </svg>

                </a>


                <a href="event.html">
                    <button
                        class="secondary-btn"
                        id="backButton"
                    >
                        بازگشت به صفحه رویداد
                    </button>
                </a>

            </div>


            <!-- Footer -->
            <div class="card-footer">

                <span class="footer-line"></span>

                <span>
                    انجمن علمی مهندسی شیمی
                </span>

                <span class="footer-line"></span>

            </div>

        </div>

    </main>


    <script src="js/success.js"></script>
    <script src="js/next .js"></script>

</body>

</html>
